<header class="page-header" id="top">
  <div class="container header-inner">
    <a
      class="brand-link"
      href="./index.html"
      aria-label="Vyshyvanka Vibes home"
    >
      <img src="./img/logo.svg" alt="" width="44" height="39" />
    </a>
    <nav class="header-nav" aria-label="Main navigation">
      <ul class="header-nav__list">
        <li><a class="header-nav__link" href="#about-us">About us</a></li>
        <li>
          <a class="header-nav__link" href="#our-collection">Our collection</a>
        </li>
        <li>
          <a class="header-nav__link" href="#customer-order">Customer order</a>
        </li>
        <li>
          <a class="header-nav__link" href="#testimonials">Testimonials</a>
        </li>
      </ul>
    </nav>
    <div class="header-actions">
      <a class="header-phone" href="tel:+380684439426">+380 (68) 443-94-26</a>
      <ul class="header-socials" aria-label="Social media">
        <li>
          <a
            class="social-link"
            role="link"
            aria-label="Facebook (coming soon)"
            aria-disabled="true"
          >
            <img
              class="social-link__facebook"
              src="./img/icons/facebook.svg"
              alt=""
              width="28"
              height="28"
            />
          </a>
        </li>
        <li>
          <a
            class="social-link"
            role="link"
            aria-label="Instagram (coming soon)"
            aria-disabled="true"
          >
            <img
              src="./img/icons/instagram.svg"
              alt=""
              width="28"
              height="28"
            />
          </a>
        </li>
        <li>
          <a
            class="social-link"
            role="link"
            aria-label="YouTube (coming soon)"
            aria-disabled="true"
          >
            <img src="./img/icons/youtube.svg" alt="" width="28" height="28" />
          </a>
        </li>
      </ul>
      <button
        class="menu-toggle"
        type="button"
        aria-label="Open navigation menu"
        aria-controls="mobile-menu"
        aria-expanded="false"
        aria-haspopup="dialog"
        hidden
      >
        <picture>
          <source
            media="(min-width: 768px)"
            srcset="./img/icons/menu-open-tablet.svg"
          />
          <img src="./img/icons/menu-open-mobile.svg" alt="" />
        </picture>
      </button>
    </div>
  </div>
</header>

<dialog
  class="mobile-menu"
  id="mobile-menu"
  aria-labelledby="mobile-menu-title"
>
  <div class="mobile-menu__panel">
    <h2 class="visually-hidden" id="mobile-menu-title">Navigation menu</h2>
    <div class="mobile-menu__header">
      <a class="mobile-menu__phone" href="tel:+380684439426"
        >+380 (68) 443-94-26</a
      >
      <button
        class="mobile-menu__close"
        type="button"
        aria-label="Close navigation menu"
        autofocus
      >
        <picture>
          <source
            media="(min-width: 768px)"
            srcset="./img/icons/menu-close-tablet.svg"
          />
          <img src="./img/icons/menu-close-mobile.svg" alt="" />
        </picture>
      </button>
    </div>
    <nav class="mobile-menu__nav" aria-label="Mobile navigation">
      <ul class="mobile-menu__list">
        <li><a class="mobile-menu__link" href="#about-us">About us</a></li>
        <li>
          <a class="mobile-menu__link" href="#our-collection">Our collection</a>
        </li>
        <li>
          <a class="mobile-menu__link" href="#customer-order">Customer order</a>
        </li>
        <li>
          <a class="mobile-menu__link" href="#testimonials">Testimonials</a>
        </li>
      </ul>
    </nav>
    <div class="mobile-menu__decoration" aria-hidden="true">
      <picture class="mobile-menu__ornament">
        <source
          media="(min-width: 768px)"
          srcset="./img/icons/menu-ornament-tablet.svg"
        />
        <img src="./img/icons/menu-ornament-mobile.svg" alt="" />
      </picture>
    </div>
  </div>
</dialog>
